name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through SECURITY.md, not issues. Never paste real candidate data, API keys or invite links.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin panel (challenges, invites, live view, report)
        - Candidate workspace (terminal, editor, browser, agents)
        - Sandbox image or Docker driver
        - AI gateway and budgets
        - Deployment (docker compose or Kubernetes)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
